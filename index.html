<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>World Clock</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
	<header>
		<p class="banner">You have all the time in the world!</p>
	</header>

	<main class="globe-stage">
		<h1 id="page-title" role="button" tabindex="0" aria-label="Refresh the page">World Clock</h1>
		<img class="globe-image" src="assets/images/earth.jpg" alt="The Earth viewed from space">
		<form class="city-form" id="city-form">
			<label for="city-input">Find a city</label>
			<div class="city-input-row">
				<input id="city-input" name="city" type="search" placeholder="Enter a city" autocomplete="address-level2" required>
				<button type="submit">Search</button>
			</div>
			<p class="city-result" id="city-result" aria-live="polite"></p>
		</form>
	</main>

	<footer>
		<p>Connect with World Clock</p>
		<nav class="social-links" aria-label="Social media links">
			<a href="https://www.facebook.com/" aria-label="Facebook" target="_blank" rel="noopener noreferrer"><i class="bi bi-facebook" aria-hidden="true"></i></a>
			<a href="https://x.com/" aria-label="X" target="_blank" rel="noopener noreferrer"><i class="bi bi-twitter-x" aria-hidden="true"></i></a>
			<a href="https://www.instagram.com/" aria-label="Instagram" target="_blank" rel="noopener noreferrer"><i class="bi bi-instagram" aria-hidden="true"></i></a>
		</nav>
	</footer>

	<script src="js.js"></script>
</body>
</html>
